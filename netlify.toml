[build]
  publish = "."

[[redirects]]
  from = "http://talentquesst.in/*"
  to   = "https://talentquesst.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.talentquesst.in/*"
  to   = "https://talentquesst.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.talentquesst.in/*"
  to   = "https://talentquesst.in/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
